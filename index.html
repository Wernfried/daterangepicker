<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>daterangepicker</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    {
        "imports": {
          "luxon": "/node_modules/luxon/build/es6/luxon.mjs",
          "daterangepicker": "/src/daterangepicker.js"
        }
      }
    </script>
  <link rel="stylesheet" type="text/css" href="css/daterangepicker.css" />

  <script type="module">
    import { DateTime, Duration, Info, Settings, Interval } from 'luxon';
    import { daterangepicker, getDateRangePicker } from 'daterangepicker';

    const picker = daterangepicker('#picker', {
      startDate: DateTime.now(),
      timePicker: false,
      autoApply: true,
      //singleDatePicker: true,
      altInput: document.getElementById('range'),
      //altInput: [document.getElementById('startDate'),document.getElementById('endDate')],
      altFormat: {  includeOffset: false }
    });
    picker.addEventListener('beforeHide', (ev) => {
      ev.preventDefault()
    });
    picker.show();

  </script>
</head>

<body>
  <div>
    <input type="text" id="picker" size="30" />
  </div>
  <div style="padding-top: 300px">
    <input type="text" id="startDate" size="30" />
    <input type="text" id="endDate" size="30" />
    <input type="text" id="range" size="50" />
  </div>
</body>

</html>
